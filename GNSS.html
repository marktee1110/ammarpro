/* ============================================================
   GLOBAL STATE
============================================================ */

let satMap = null;
let satTileLayer = null;

let userMarker = null;
let accuracyCircle = null;

let watchId = null;

let isFirstGPS = true;
let currentUserLatLng = null;

let lastXStr = "--";
let lastYStr = "--";

let isAveraging = false;
let avgReadings = [];

const TARGET_READINGS = 30;

let avgTimeoutTimer = null;


/* ============================================================
   AMMAR ENGINE TRANSFORM

   Local X/Y → WGS84 Lat/Lon
============================================================ */

function ammar_engine_transform(rawX, rawY) {

  const x = -Math.abs(Number(rawX));
  const y = Math.abs(Number(rawY));

  const x2 = x / 100000.0;
  const y2 = y / 100000.0;

  const lat =
    34.1995728022708
    + (-0.000109034258955 * x2)
    + (0.901919449198777 * y2)
    + (-0.004804938821993 * Math.pow(x2, 2))
    + (-0.0000092638803 * x2 * y2)
    + (-0.0000619942778 * Math.pow(y2, 2))
    + (-0.0000023827326 * Math.pow(x2, 3))
    + (-0.0001079065784 * Math.pow(x2, 2) * y2)
    + (0.0000045190021 * x2 * Math.pow(y2, 2))
    + (-0.0000188294226 * Math.pow(y2, 3));

  const lon =
    39.1511562415421
    + (1.08544552373339 * x2)
    + (0.000141152839858 * y2)
    + (-0.0000227915953 * Math.pow(x2, 2))
    + (0.01158568614149 * x2 * y2)
    + (0.0000184425821 * Math.pow(y2, 2))
    + (-0.0000667439376 * Math.pow(x2, 3))
    + (0.0171280222 * Math.pow(x2, 2) * y2 * 0.001)
    + (0.0001975916378 * x2 * Math.pow(y2, 2))
    + (-0.0000060696491 * Math.pow(y2, 3));

  return {
    lat,
    lon
  };
}


/* ============================================================
   AMMAR ENGINE INVERSE

   WGS84 Lat/Lon → Local X/Y

   Newton-Raphson
   Analytical Jacobian
============================================================ */

function ammar_engine_inverse(latTarget, lonTarget) {

  latTarget = Number(latTarget);
  lonTarget = Number(lonTarget);

  if (
    !Number.isFinite(latTarget) ||
    !Number.isFinite(lonTarget)
  ) {
    throw new Error("Invalid GPS coordinates.");
  }


  /* ----------------------------------------------------------
     Initial approximation
  ---------------------------------------------------------- */

  let x2 =
    (lonTarget - 39.1511562415421) /
    1.08544552373339;

  let y2 =
    (latTarget - 34.1995728022708) /
    0.901919449198777;


  /*
    Original coordinate domain:
    
    X <= 0
    Y >= 0
  */

  x2 = Math.min(0, x2);
  y2 = Math.max(0, y2);


  const maxIterations = 25;
  const tolerance = 1e-11;


  for (
    let i = 0;
    i < maxIterations;
    i++
  ) {


    /* --------------------------------------------------------
       Current latitude
    -------------------------------------------------------- */

    const lat =
      34.1995728022708

      + (-0.000109034258955 * x2)

      + (0.901919449198777 * y2)

      + (-0.004804938821993 * x2 ** 2)

      + (-0.0000092638803 * x2 * y2)

      + (-0.0000619942778 * y2 ** 2)

      + (-0.0000023827326 * x2 ** 3)

      + (-0.0001079065784 * x2 ** 2 * y2)

      + (0.0000045190021 * x2 * y2 ** 2)

      + (-0.0000188294226 * y2 ** 3);


    /* --------------------------------------------------------
       Current longitude
    -------------------------------------------------------- */

    const lon =
      39.1511562415421

      + (1.08544552373339 * x2)

      + (0.000141152839858 * y2)

      + (-0.0000227915953 * x2 ** 2)

      + (0.01158568614149 * x2 * y2)

      + (0.0000184425821 * y2 ** 2)

      + (-0.0000667439376 * x2 ** 3)

      + (0.0171280222 * x2 ** 2 * y2 * 0.001)

      + (0.0001975916378 * x2 * y2 ** 2)

      + (-0.0000060696491 * y2 ** 3);


    /* --------------------------------------------------------
       Errors
    -------------------------------------------------------- */

    const fLat =
      lat - latTarget;

    const fLon =
      lon - lonTarget;


    /* --------------------------------------------------------
       Convergence
    -------------------------------------------------------- */

    if (
      Math.abs(fLat) < tolerance &&
      Math.abs(fLon) < tolerance
    ) {

      return {

        x: -x2 * 100000,

        y: y2 * 100000,

        x2,
        y2,

        lat,
        lon,

        iterations: i + 1

      };
    }


    /* --------------------------------------------------------
       Analytical Jacobian
    -------------------------------------------------------- */

    const dLatDx =
      -0.000109034258955

      + (-0.004804938821993 * 2 * x2)

      + (-0.0000092638803 * y2)

      + (-0.0000023827326 * 3 * x2 ** 2)

      + (-0.0001079065784 * 2 * x2 * y2)

      + (0.0000045190021 * y2 ** 2);


    const dLatDy =
      0.901919449198777

      + (-0.0000092638803 * x2)

      + (-0.0000619942778 * 2 * y2)

      + (-0.0001079065784 * x2 ** 2)

      + (0.0000045190021 * 2 * x2 * y2)

      + (-0.0000188294226 * 3 * y2 ** 2);


    const dLonDx =
      1.08544552373339

      + (-0.0000227915953 * 2 * x2)

      + (0.01158568614149 * y2)

      + (-0.0000667439376 * 3 * x2 ** 2)

      + (0.0171280222 * 0.001 * 2 * x2 * y2)

      + (0.0001975916378 * y2 ** 2);


    const dLonDy =
      0.000141152839858

      + (0.01158568614149 * x2)

      + (0.0000184425821 * 2 * y2)

      + (0.0171280222 * 0.001 * x2 ** 2)

      + (0.0001975916378 * 2 * x2 * y2)

      + (-0.0000060696491 * 3 * y2 ** 2);


    /* --------------------------------------------------------
       Determinant
    -------------------------------------------------------- */

    const det =
      dLatDx * dLonDy -
      dLatDy * dLonDx;


    if (
      Math.abs(det) < 1e-14
    ) {

      throw new Error(
        "Inverse failed: singular Jacobian."
      );
    }


    /* --------------------------------------------------------
       Newton correction
    -------------------------------------------------------- */

    const dx =
      (
        dLonDy * fLat -
        dLatDy * fLon
      ) / det;


    const dy =
      (
        -dLonDx * fLat +
        dLatDx * fLon
      ) / det;


    x2 -= dx;
    y2 -= dy;


    /*
      Keep original domain
    */

    x2 = Math.min(0, x2);
    y2 = Math.max(0, y2);

  }


  /*
    Return last calculated solution
  */

  return {

    x: -x2 * 100000,

    y: y2 * 100000,

    x2,
    y2,

    lat: latTarget,
    lon: lonTarget,

    iterations: maxIterations

  };
}


/* ============================================================
   INITIALIZE MAP
============================================================ */

function initMap() {

  const googleHybrid =
    L.tileLayer(
      'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
      {
        maxZoom: 21,
        attribution: 'Google Hybrid'
      }
    );


  const tileUrl =
    'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}';


  if (L.tileLayer.offline) {

    satTileLayer =
      L.tileLayer.offline(
        tileUrl,
        {
          maxZoom: 21,
          crossOrigin: true,
          attribution: 'Offline Hybrid'
        }
      );

  } else {

    satTileLayer =
      googleHybrid;

  }


  satMap =
    L.map(
      'satMapContainer',
      {
        layers: [satTileLayer],
        zoomControl: false,
        rotate: true,
        touchRotate: true,
        rotateControl: false
      }
    )
    .setView(
      [34.5, 38.5],
      7
    );


  L.control.zoom({
    position: 'bottomleft'
  }).addTo(satMap);


  satMap.on(
    'rotate zoom move',
    () => {

      const bearing =
        satMap.getBearing
          ? satMap.getBearing()
          : 0;


      document
        .getElementById('compassArrow')
        .style.transform =
        `rotate(${bearing}deg)`;

    }
  );


  startProLiveTracking();
}


/* ============================================================
   RESET MAP NORTH
============================================================ */

function resetMapNorth() {

  if (
    satMap &&
    satMap.setBearing
  ) {

    satMap.setBearing(0);

  } else if (satMap) {

    satMap.setView(
      satMap.getCenter(),
      satMap.getZoom()
    );
  }


  document
    .getElementById('compassArrow')
    .style.transform =
    'rotate(0deg)';
}


/* ============================================================
   GPS LIVE TRACKING
============================================================ */

function startProLiveTracking() {

  if (!navigator.geolocation) {

    alert(
      "خدمة تحديد الموقع غير مدعومة في جهازك."
    );

    return;
  }


  const options = {

    enableHighAccuracy: true,

    maximumAge: 0,

    timeout: 10000

  };


  watchId =
    navigator.geolocation.watchPosition(

      (pos) => {

        try {

          /* --------------------------------------------------
             REAL GPS
          -------------------------------------------------- */

          const lat =
            Number(
              pos.coords.latitude
            );


          const lon =
            Number(
              pos.coords.longitude
            );


          const alt =
            Number.isFinite(
              pos.coords.altitude
            )
              ? pos.coords.altitude
              : 0;


          const acc =
            Number.isFinite(
              pos.coords.accuracy
            )
              ? pos.coords.accuracy
              : 0;


          currentUserLatLng = {
            lat: lat,
            lng: lon
          };


          /* --------------------------------------------------
             GPS → AMMAR LOCAL X/Y
          -------------------------------------------------- */

          const localXY =
            ammar_engine_inverse(
              lat,
              lon
            );


          /* --------------------------------------------------
             LIVE X/Y

             Update immediately on every GPS reading
          -------------------------------------------------- */

          if (!isAveraging) {

            lastXStr =
              localXY.x.toFixed(3);


            lastYStr =
              localXY.y.toFixed(3);


            document
              .getElementById("liveX")
              .innerText =
              lastXStr;


            document
              .getElementById("liveY")
              .innerText =
              lastYStr;


            document
              .getElementById("liveAlt")
              .innerText =
              alt.toFixed(1) + "م";
          }


          /* --------------------------------------------------
             AVERAGING
          -------------------------------------------------- */

          if (isAveraging) {

            avgReadings.push({

              x: localXY.x,

              y: localXY.y,

              alt: alt

            });


            const progress =
              avgReadings.length;


            document
              .getElementById("btnAvg")
              .innerText =
              `رصد (${progress}/${TARGET_READINGS})`;


            if (
              avgReadings.length >=
              TARGET_READINGS
            ) {

              finalizeAveraging();
            }
          }


          /* --------------------------------------------------
             REAL GPS ACCURACY
          -------------------------------------------------- */

          document
            .getElementById("liveAcc")
            .innerText =
            acc > 0
              ? "±" + acc.toFixed(1) + "م"
              : "-";


          /*
            Browser Geolocation API
            does NOT provide satellite count.

            So do not show fake 32/40.
          */

          document
            .getElementById("satCount")
            .innerText =
            "GPS OK";


          /* --------------------------------------------------
             ACCURACY CIRCLE
          -------------------------------------------------- */

          if (!accuracyCircle) {

            accuracyCircle =
              L.circle(
                [lat, lon],
                {
                  radius: acc || 1,

                  color: '#1a73e8',

                  weight: 1,

                  fillColor: '#1a73e8',

                  fillOpacity: 0.25
                }
              )
              .addTo(satMap);

          } else {

            accuracyCircle
              .setLatLng(
                [lat, lon]
              );


            accuracyCircle
              .setRadius(
                acc || 1
              );
          }


          /* --------------------------------------------------
             USER MARKER
          -------------------------------------------------- */

          if (!userMarker) {

            const icon =
              L.divIcon({

                className:
                  'user-loc-pulse',

                iconSize:
                  [20, 20],

                iconAnchor:
                  [10, 10]

              });


            userMarker =
              L.marker(
                [lat, lon],
                {
                  icon: icon
                }
              )
              .addTo(satMap);

          } else {

            userMarker
              .setLatLng(
                [lat, lon]
              );
          }


          /* --------------------------------------------------
             FIRST GPS FIX
          -------------------------------------------------- */

          if (isFirstGPS) {

            satMap.flyTo(
              [lat, lon],
              19,
              {
                duration: 1.2
              }
            );


            isFirstGPS = false;
          }

        } catch (error) {

          console.error(
            "Ammar conversion error:",
            error
          );


          document
            .getElementById("satCount")
            .innerText =
            "CONVERSION ERROR";
        }

      },


      /* ------------------------------------------------------
         GPS ERROR
      ------------------------------------------------------ */

      (err) => {

        console.error(
          "GPS Error:",
          err
        );


        let message =
          "GPS ERROR";


        if (err.code === 1) {

          message =
            "GPS DENIED";
        }


        if (err.code === 2) {

          message =
            "NO GPS";
        }


        if (err.code === 3) {

          message =
            "GPS TIMEOUT";
        }


        document
          .getElementById("satCount")
          .innerText =
          message;

      },


      options
    );
}


/* ============================================================
   START / STOP AVERAGING
============================================================ */

function toggleAveraging() {

  if (!isAveraging) {

    avgReadings = [];

    isAveraging = true;


    const btn =
      document.getElementById(
        "btnAvg"
      );


    btn.classList.add(
      "active"
    );


    btn.innerText =
      `رصد (0/${TARGET_READINGS})`;


    avgTimeoutTimer =
      setTimeout(
        () => {

          if (isAveraging) {

            finalizeAveraging();
          }

        },
        5000
      );

  } else {

    cancelAveraging();
  }
}


/* ============================================================
   FINALIZE AVERAGING
============================================================ */

function finalizeAveraging() {

  if (avgTimeoutTimer) {

    clearTimeout(
      avgTimeoutTimer
    );

    avgTimeoutTimer = null;
  }


  if (
    avgReadings.length === 0
  ) {

    cancelAveraging();


    alert(
      "لم يتم استقبال أي قراءات، حاول مرة أخرى."
    );


    return;
  }


  let sumX = 0;
  let sumY = 0;
  let sumAlt = 0;


  avgReadings.forEach(
    (r) => {

      sumX += r.x;

      sumY += r.y;

      sumAlt += r.alt;

    }
  );


  const count =
    avgReadings.length;


  const finalX =
    sumX / count;


  const finalY =
    sumY / count;


  const finalAlt =
    sumAlt / count;


  lastXStr =
    finalX.toFixed(3);


  lastYStr =
    finalY.toFixed(3);


  document
    .getElementById("liveX")
    .innerText =
    lastXStr;


  document
    .getElementById("liveY")
    .innerText =
    lastYStr;


  document
    .getElementById("liveAlt")
    .innerText =
    finalAlt.toFixed(1) + "م";


  isAveraging = false;


  const btnAvg =
    document.getElementById(
      "btnAvg"
    );


  btnAvg.innerText =
    `🎯 ثابت (${count} ق)`;


  btnAvg.classList.remove(
    "active"
  );


  setTimeout(
    () => {

      if (!isAveraging) {

        btnAvg.innerText =
          "🎯 رصد دقيق";
      }

    },
    3000
  );
}


/* ============================================================
   CANCEL AVERAGING
============================================================ */

function cancelAveraging() {

  if (avgTimeoutTimer) {

    clearTimeout(
      avgTimeoutTimer
    );

    avgTimeoutTimer = null;
  }


  isAveraging = false;


  const btn =
    document.getElementById(
      "btnAvg"
    );


  btn.classList.remove(
    "active"
  );


  btn.innerText =
    "🎯 رصد دقيق";
}


/* ============================================================
   CENTER TO USER
============================================================ */

function centerToUser() {

  if (
    currentUserLatLng
  ) {

    satMap.flyTo(

      [
        currentUserLatLng.lat,
        currentUserLatLng.lng
      ],

      19,

      {
        duration: 1.0
      }

    );

  } else {

    alert(
      "جاري البحث عن موقعك الحالي..."
    );
  }
}


/* ============================================================
   SPEAK X/Y
============================================================ */

function speakCurrentCoordinates() {

  if (
    lastXStr === "--" ||
    lastYStr === "--"
  ) {

    alert(
      "بانتظار التقاط إشارة الـ GPS أولاً."
    );

    return;
  }


  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "متصفحك لا يدعم خاصية النطق الصوتي."
    );

    return;
  }


  window.speechSynthesis.cancel();


  const message =
    `إكس ${lastXStr}، واي ${lastYStr}`;


  const utterance =
    new SpeechSynthesisUtterance(
      message
    );


  utterance.lang =
    "ar-SA";


  utterance.rate =
    1.0;


  window.speechSynthesis.speak(
    utterance
  );
}
